<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExplorePH Login/Register</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
  body, html {
    height: 100%;
    margin: 0;
    font-family: 'Poppins', sans-serif;
    position: relative;
    overflow: hidden;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('images/background2.jpg') no-repeat center center fixed;
    background-size: cover;
    filter: blur(5px);
    z-index: -1;
}

  .form-slideshow-box {
    max-width: 900px;
    width: 90%;
    margin: 5% auto;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .form-section {
    flex: 1;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .form-section img.logo {
    width: 120px;
    margin-bottom: 20px;
  }

  .form-section h2 {
    font-weight: 600;
    margin-bottom: 25px;
    color: #333;
  }

  .form-control {
    border-radius: 50px;
    padding: 12px 20px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
  }

  .btn-primary, .btn-success {
    border-radius: 50px;
    padding: 12px 25px;
    font-weight: 600;
    width: 100%;
  }

  .form-section p {
    margin-top: 15px;
    text-align: center;
  }

  .slideshow-section {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .slideshow-section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }

  .slideshow-section img.active {
    opacity: 1;
  }

  @media(max-width: 768px) {
    .form-slideshow-box {
      flex-direction: column;
      max-width: 400px;
    }
    .slideshow-section {
      height: 250px;
    }
  }
</style>
</head>
<body>

<div class="form-slideshow-box">

  <!-- Form Section -->
  <div class="form-section">

    <h2>Login to ExplorePH</h2>
    <form action="login.php" method="POST">
    <input type="text" class="form-control" name="username" placeholder="Username" required>
    <input type="password" class="form-control" name="password" placeholder="Password" required>
    <button type="submit" class="btn btn-primary mb-3">Login</button>
</form>
    <p>Don't have an account? <a href="#" data-bs-toggle="modal" data-bs-target="#registerModal">Register</a></p>
  </div>

  <!-- Slideshow Section -->
  <div class="slideshow-section">
    <img src="images/Palawan.jpg" class="active" alt="Palawan">
    <img src="images/Boracay.png" alt="Boracay">
    <img src="images/Baguio.jpg" alt="Baguio">
  </div>

</div>

<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-4">
      <div class="modal-header">
        <h5 class="modal-title" id="registerModalLabel">Register to ExplorePH</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="registerForm" action="register.php" method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <input type="text" class="form-control" id="fullname" name="fullname" placeholder="Full Name" required>
          </div>
          <div class="mb-3">
            <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
          </div>
          <div class="mb-3">
            <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
          </div>
          <div class="mb-3">
            <input type="text" class="form-control" id="password" name="password" placeholder="Password" required>
          </div>
          <div class="mb-3">
            <input type="tel" class="form-control" id="telephone" name="telephone" placeholder="Telephone (11 digits)" pattern="\d{11}" required>
          </div>
          <!-- File upload for valid ID -->
          <div class="mb-3">
            <label for="validId" class="form-label">Upload Valid ID (JPG/PNG only)</label>
            <input type="file" class="form-control" id="validId" name="validId" accept=".jpg,.jpeg,.png" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Register</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="loginErrorModal" tabindex="-1" aria-labelledby="loginErrorLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3">
      <div class="modal-header">
        <h5 class="modal-title" id="loginErrorLabel">Login Error</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Incorrect username or password.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

<script>

  const slides = document.querySelectorAll('.slideshow-section img');
  let current = 0;
  setInterval(() => {
    slides[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
  }, 4000);

  // Client-side validation for telephone
  const registerForm = document.getElementById('registerForm');
  registerForm.addEventListener('submit', function(e) {
    const tel = document.getElementById('telephone').value;
    if(!/^\d{11}$/.test(tel)) {
      alert('Telephone number must be exactly 11 digits.');
      e.preventDefault();
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
